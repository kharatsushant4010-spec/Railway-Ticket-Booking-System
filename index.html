<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Railway Ticket Booking System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <div class="nav-left-text">Railway Ticket Booking</div>
        <div class="search-container">
            <input type="text" placeholder="Search...">
            <button type="submit"><i class="fa fa-search"></i></button>
        </div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="Schedules.html">Schedules</a>
            <a href="Contact.html">Contact</a>
            <a href="demo_1.html">Book</a>
        </div>
    </div>

    <div class="bg">
        <div class="container">
            <h1>Railway Ticket Booking</h1>
            <div id="bookTicketText" onclick="startBooking()">Book Ticket</div>
            <div id="bookingContent" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-step active" id="step1">
                        <i class="fas fa-user"></i>
                        <div>Customer Details</div>
                    </div>
                    <div class="progress-step" id="step2">
                        <i class="fas fa-ticket-alt"></i>
                        <div>Ticket Details</div>
                    </div>
                    <div class="progress-step" id="step3">
                        <i class="fas fa-check-circle"></i>
                        <div>Confirmation</div>
                    </div>
                </div>

                <!-- Customer Details Form -->
                <form id="customerForm">
                    <div class="form-group">
                        <label for="passengerName">Passenger Name</label>
                        <input type="text" id="passengerName" required>
                        <div class="error" id="nameError"></div>
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" required>
                        <div class="error" id="phoneError"></div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                        <div class="error" id="emailError"></div>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" required>
                        <div class="error" id="addressError"></div>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                        <div class="error" id="dobError"></div>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                        <div class="error" id="genderError"></div>
                    </div>
                    <button type="submit">Next</button>
                </form>

                <!-- Ticket Details Form -->
                <form id="ticketForm" style="display: none;">
                    <div class="form-group">
                        <label for="from">From</label>
                        <input type="text" id="from" required>
                        <div class="error" id="fromError"></div>
                    </div>
                    <div class="form-group">
                        <label for="to">To</label>
                        <input type="text" id="to" required>
                        <div class="error" id="toError"></div>
                    </div>
                    <div class="form-group">
                        <label for="date">Date of Travel</label>
                        <input type="date" id="date" required>
                        <div class="error" id="dateError"></div>
                    </div>
                    <div class="form-group">
                        <label for="passengers">Number of Passengers</label>
                        <input type="number" id="passengers" min="1" required>
                        <div class="error" id="passengersError"></div>
                    </div>
                    <div class="form-group">
                        <label for="class">Class</label>
                        <select id="class" required>
                            <option value="">Select Class</option>
                            <option value="Sleeper">Sleeper</option>
                            <option value="AC 3 Tier (3A)">AC 3 Tier (3A)</option>
                            <option value="AC 2 Tier (2A)">AC 2 Tier (2A)</option>
                            <option value="AC First Class (1A)">AC First Class (1A)</option>
                        </select>
                        <div class="error" id="classError"></div>
                    </div>
                    <div class="form-group">
                        <label for="preferredSeat">Preferred Seat</label>
                        <select id="preferredSeat">
                            <option value="">No Preference</option>
                            <option value="window">Window</option>
                            <option value="aisle">Aisle</option>
                            <option value="middle">Middle</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mealPreference">Meal Preference</label>
                        <select id="mealPreference">
                            <option value="none">No Meal</option>
                            <option value="veg">Vegetarian</option>
                            <option value="nonveg">Non-Vegetarian</option>
                            <option value="vegan">Vegan</option>
                        </select>
                    </div>
                    <button type="submit">Book Ticket</button>
                </form>

                <!-- Booking Confirmation -->
                <div id="bookingDetails" style="display: none;">
                    <h2>Booking Confirmation</h2>
                    <p>Your ticket has been booked successfully!</p>
                    <button id="generateReceiptBtn" onclick="generateReceipt()">Generate Ticket Receipt</button>
                </div>

                <!-- Ticket Receipt -->
                <div id="ticketReceipt" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
